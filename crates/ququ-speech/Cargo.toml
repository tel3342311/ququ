[package]
name = "ququ-speech"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python-free local speech inference and verified model management for QuQu"

[features]
default = ["native"]
native = ["dep:sherpa-onnx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["s2t-conversion"] }
sherpa-onnx = { version = "=1.13.8", optional = true }

[dev-dependencies]

